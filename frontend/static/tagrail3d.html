<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tag rail 3D</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,600;0,800;1,600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
html,body{margin:0;height:100%;background:transparent;overflow:hidden;font-family:'DM Mono',ui-monospace,Menlo,Consolas,monospace;}
#wrap{position:relative;width:100%;height:100%;min-height:200px;}
canvas{display:block;width:100%;height:100%;cursor:grab;touch-action:pan-y;}
canvas:active{cursor:grabbing;}
.hint{position:absolute;right:6px;bottom:2px;font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:#8C7B57;pointer-events:none;}
.fallback{display:none;position:absolute;inset:0;align-items:center;justify-content:center;flex-wrap:wrap;gap:10px;padding:10px;}
.fallback span{background:#FFD36B;border:1.5px dashed #12372A;border-radius:6px 16px 16px 6px;padding:8px 16px;font-weight:500;font-size:13px;color:#12372A;}
.nogl canvas,.nogl .hint{display:none;}.nogl .fallback{display:flex;}
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js" defer></script>
</head>
<body>
<div id="wrap">
  <canvas id="tagrail" aria-label="Hanging price tags for well-known retail stocks. Drag a tag to swing it, click to flip it." role="img"></canvas>
  <div class="hint">Drag · click to flip</div>
  <div class="fallback"><span>WMT</span><span>COST</span><span>TGT</span><span>HD</span><span>NKE</span><span>AMZN</span><span>LOW</span></div>
</div>
<script>
(function(){
/* Hanging price-tag rail: pendulum tags on a rail. Drag a tag to swing it, move the pointer through them to set them swaying, click to flip. */
function initTagRail(cv, wrap) {
  var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var TAGS = [
    {k: 'WMT', n: 'Walmart', s: 'Discount retail', c: '#FF6B4A', ink: '#1A1A1A'},
    {k: 'COST', n: 'Costco', s: 'Warehouse clubs', c: '#FFD36B', ink: '#1A1A1A'},
    {k: 'TGT', n: 'Target', s: 'General merchandise', c: '#FFF8EE', ink: '#12372A'},
    {k: 'HD', n: 'Home Depot', s: 'Home improvement', c: '#12372A', ink: '#FFF8EE'},
    {k: 'NKE', n: 'Nike', s: 'Apparel & footwear', c: '#FF6B4A', ink: '#1A1A1A'},
    {k: 'AMZN', n: 'Amazon', s: 'E-commerce', c: '#FFD36B', ink: '#1A1A1A'},
    {k: 'LOW', n: "Lowe's", s: 'Home improvement', c: '#FFF8EE', ink: '#12372A'}
  ];
  var T = window.THREE, renderer;
  if (!T) { wrap.classList.add('nogl'); return; }
  try { renderer = new T.WebGLRenderer({canvas: cv, antialias: true, alpha: true}); } catch (e) { wrap.classList.add('nogl'); return; }
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  renderer.outputEncoding = T.sRGBEncoding;
  var scene = new T.Scene(), camera = new T.PerspectiveCamera(30, 1, 0.1, 100);
  scene.add(new T.HemisphereLight(0xffffff, 0xd9c9a6, 0.95));
  var key = new T.DirectionalLight(0xffffff, 0.7); key.position.set(-3, 5, 7); scene.add(key);
  var maxAniso = renderer.capabilities.getMaxAnisotropy();

  function mk(w, h) { var c = document.createElement('canvas'); c.width = w; c.height = h; return c; }
  function tex(c) { var t = new T.CanvasTexture(c); t.encoding = T.sRGBEncoding; t.anisotropy = maxAniso; t.repeat.set(1 / 1.2, 1 / 1.8); t.offset.set(0.5, 0.5); t.wrapS = t.wrapT = T.ClampToEdgeWrapping; return t; }
  function rr(x, a, b, w, h, r) { x.beginPath(); x.moveTo(a + r, b); x.lineTo(a + w - r, b); x.quadraticCurveTo(a + w, b, a + w, b + r); x.lineTo(a + w, b + h - r); x.quadraticCurveTo(a + w, b + h, a + w - r, b + h); x.lineTo(a + r, b + h); x.quadraticCurveTo(a, b + h, a, b + h - r); x.lineTo(a, b + r); x.quadraticCurveTo(a, b, a + r, b); x.closePath(); }
  function barcode(x, ink, seed, a, b, w, h) {
    var s = seed * 9301 + 49297, px = a; x.fillStyle = ink;
    while (px < a + w - 6) { s = (s * 9301 + 49297) % 233280; var bw = 3 + Math.floor((s / 233280) * 8), gap = 3 + Math.floor(((s * 7) % 233280) / 233280 * 6); x.fillRect(px, b, bw, h); px += bw + gap; }
  }
  var FS = "800 {S}px Fraunces, Georgia, serif", MONO = "600 {S}px 'DM Mono', Menlo, monospace";
  function font(t, s) { return t.replace('{S}', s); }
  function frontTex(i) {
    var d = TAGS[i], c = mk(480, 720), x = c.getContext('2d');
    x.fillStyle = d.c; x.fillRect(0, 0, 480, 720);
    x.strokeStyle = d.ink; x.globalAlpha = 0.35; x.lineWidth = 3; x.setLineDash([12, 9]); rr(x, 24, 190, 432, 506, 18); x.stroke(); x.setLineDash([]); x.globalAlpha = 1;
    x.fillStyle = d.ink; x.textAlign = 'center'; x.textBaseline = 'alphabetic';
    x.globalAlpha = 0.7; x.font = font(MONO, 22); x.fillText('S&P 500 · RETAIL', 240, 236); x.globalAlpha = 1;
    var size = 150; x.font = font(FS, size); while (x.measureText(d.k).width > 380 && size > 60) { size -= 6; x.font = font(FS, size); }
    x.fillText(d.k, 240, 360);
    x.font = "italic 600 40px Fraunces, Georgia, serif"; x.fillText(d.n, 240, 418);
    x.font = font(MONO, 22); var sw = x.measureText(d.s).width + 36; x.globalAlpha = 0.85; x.lineWidth = 2.5; x.strokeStyle = d.ink; rr(x, 240 - sw / 2, 440, sw, 40, 20); x.stroke(); x.globalAlpha = 1; x.fillText(d.s, 240, 468);
    x.fillStyle = d.ink; rr(x, 70, 508, 340, 66, 12); x.fill();
    x.fillStyle = d.c; x.font = font(MONO, 30); x.fillText('RESEARCH →', 240, 552);
    barcode(x, d.ink, i + 3, 76, 604, 328, 62);
    return tex(c);
  }
  function backTex(i) {
    var d = TAGS[i], c = mk(480, 720), x = c.getContext('2d');
    x.fillStyle = '#FFF8EE'; x.fillRect(0, 0, 480, 720);
    x.strokeStyle = '#12372A'; x.globalAlpha = 0.3; x.lineWidth = 3; x.setLineDash([12, 9]); rr(x, 24, 190, 432, 506, 18); x.stroke(); x.setLineDash([]); x.globalAlpha = 1;
    x.fillStyle = '#12372A'; x.textAlign = 'left'; x.font = font(MONO, 24); x.fillText('WHAT YOU GET', 56, 246);
    x.fillRect(56, 262, 368, 3);
    var rows = ['Plain-English profile', 'Side-by-side compare', 'Portfolio risk flags', 'Theme discovery', 'Learn the basics'];
    rows.forEach(function (r, k) { var y = 322 + k * 62; x.fillStyle = '#FF6B4A'; x.beginPath(); x.arc(70, y - 10, 11, 0, 7); x.fill(); x.fillStyle = '#FFF8EE'; x.font = "700 18px 'DM Mono', monospace"; x.textAlign = 'center'; x.fillText('✓', 70, y - 4); x.textAlign = 'left'; x.fillStyle = '#1A1A1A'; x.font = "600 29px Fraunces, Georgia, serif"; x.fillText(r, 96, y); });
    barcode(x, '#12372A', i + 11, 56, 628, 368, 38);
    x.fillStyle = '#6B5E45'; x.font = font(MONO, 15); x.textAlign = 'center'; x.fillText('ILLUSTRATIVE · RESEARCH, NOT ADVICE', 240, 692);
    return tex(c);
  }

  /* tag shape: chamfered top, punched hole */
  var shape = new T.Shape();
  shape.moveTo(-0.6, -0.9); shape.lineTo(0.6, -0.9); shape.lineTo(0.6, 0.5); shape.lineTo(0.3, 0.9); shape.lineTo(-0.3, 0.9); shape.lineTo(-0.6, 0.5); shape.lineTo(-0.6, -0.9);
  var hole = new T.Path(); hole.absarc(0, 0.62, 0.09, 0, Math.PI * 2, true); shape.holes.push(hole);
  var bodyGeo = new T.ExtrudeGeometry(shape, {depth: 0.07, bevelEnabled: true, bevelThickness: 0.02, bevelSize: 0.02, bevelSegments: 2, steps: 1});
  bodyGeo.translate(0, -0.62, -0.035);
  var faceGeo = new T.ShapeGeometry(shape); faceGeo.translate(0, -0.62, 0);
  var DEPTH = 0.035 + 0.02 + 0.004;

  var stageG = new T.Group(); scene.add(stageG);
  var RAILY = 2.2;
  var twine = new T.MeshStandardMaterial({color: 0x8A6D3B, roughness: 0.9});
  var railMat = new T.MeshStandardMaterial({color: 0x12372A, metalness: 0.4, roughness: 0.4});
  var rail = new T.Mesh(new T.CylinderGeometry(0.06, 0.06, 1, 20), railMat); rail.rotation.z = Math.PI / 2; rail.position.y = RAILY; stageG.add(rail);
  var capL = new T.Mesh(new T.SphereGeometry(0.11, 18, 14), railMat), capR = capL.clone(); stageG.add(capL); stageG.add(capR);

  var tags = [], bodies = [];
  TAGS.forEach(function (d, i) {
    var L = 0.95 + (i % 3) * 0.32 + (i === 3 ? 0.05 : 0);
    var pivot = new T.Group(); pivot.position.y = RAILY; stageG.add(pivot);
    var str = new T.Mesh(new T.CylinderGeometry(0.013, 0.013, L, 6), twine); str.position.y = -L / 2; pivot.add(str);
    var flip = new T.Group(); flip.position.y = -L; pivot.add(flip);
    var body = new T.Mesh(bodyGeo, new T.MeshStandardMaterial({color: new T.Color(d.c), roughness: 0.65})); body.userData.i = i; flip.add(body); bodies.push(body);
    var fr = new T.Mesh(faceGeo, new T.MeshBasicMaterial({map: frontTex(i)})); fr.position.z = DEPTH; flip.add(fr);
    var bk = new T.Mesh(faceGeo, new T.MeshBasicMaterial({map: backTex(i)})); bk.rotation.y = Math.PI; bk.position.z = -DEPTH; flip.add(bk);
    var eye = new T.Mesh(new T.TorusGeometry(0.105, 0.022, 10, 28), new T.MeshStandardMaterial({color: 0xB8893A, metalness: 0.7, roughness: 0.35})); flip.add(eye);
    tags.push({pivot: pivot, flip: flip, L: L, th: (i % 2 ? 1 : -1) * 0.18, om: 0, yaw: 0, yawT: 0, timer: 3 + i * 1.3, x: 0});
  });

  var spacing = 1.6;
  function layout() {
    var n = tags.length, x0 = -spacing * (n - 1) / 2;
    tags.forEach(function (t, i) { t.x = x0 + i * spacing; t.pivot.position.x = t.x; });
    var w = spacing * (n - 1) + 1.6; rail.scale.y = w; capL.position.set(-w / 2, RAILY, 0); capR.position.set(w / 2, RAILY, 0);
  }
  function resize() {
    var w = cv.clientWidth, h = cv.clientHeight; if (!w || !h) return;
    renderer.setSize(w, h, false); camera.aspect = w / h;
    var H = 4.15, d = H / (2 * Math.tan(15 * Math.PI / 180));
    d = Math.max(d, 6.4 / (2 * Math.tan(15 * Math.PI / 180) * camera.aspect));       // keep the whole rail in view on narrow screens
    camera.position.set(0, 0.35, d); camera.lookAt(0, 0.35, 0); camera.updateProjectionMatrix();
    var visW = 2 * Math.tan(15 * Math.PI / 180) * d * camera.aspect;
    spacing = Math.max(1.0, Math.min(2.3, (visW - 1.8) / (tags.length - 1)));
    layout();
  }
  resize();
  if (window.ResizeObserver) new ResizeObserver(resize).observe(wrap); else window.addEventListener('resize', resize);

  /* pointer: world position on the z=0 plane, hover impulse, drag + click-to-flip */
  var ray = new T.Raycaster(), ndc = new T.Vector2(), plane = new T.Plane(new T.Vector3(0, 0, 1), 0), hit = new T.Vector3();
  function world(e) {
    var r = cv.getBoundingClientRect(); ndc.set(((e.clientX - r.left) / r.width) * 2 - 1, -((e.clientY - r.top) / r.height) * 2 + 1);
    ray.setFromCamera(ndc, camera); ray.ray.intersectPlane(plane, hit); return hit;
  }
  var grab = -1, moved = 0, lastX = 0, lastTh = 0, lastT = 0, dragVel = 0, hoverLast = null;
  cv.addEventListener('pointerdown', function (e) {
    var w = world(e); ray.setFromCamera(ndc, camera); var hs = ray.intersectObjects(bodies, false);
    if (hs.length) { grab = hs[0].object.userData.i; moved = 0; lastX = e.clientX; lastT = performance.now(); try { cv.setPointerCapture(e.pointerId); } catch (x) {} }
  });
  cv.addEventListener('pointermove', function (e) {
    var w = world(e), px = w.x, py = w.y;
    if (grab >= 0) {
      var t = tags[grab], th = Math.atan2(px - t.x, RAILY - py); th = Math.max(-1.2, Math.min(1.2, th));
      moved += Math.abs(e.clientX - lastX); lastX = e.clientX;
      var now = performance.now(); dragVel = (th - t.th) / Math.max(0.016, (now - lastT) / 1000); lastT = now; t.th = th; t.om = 0;
    } else if (!reduce && e.pointerType !== 'touch') {
      if (hoverLast !== null) {
        var dx = px - hoverLast;
        tags.forEach(function (t) { if (Math.abs(px - t.x) < 0.8 && py < RAILY - 0.2 && py > RAILY - t.L - 1.7) t.om += Math.max(-3, Math.min(3, dx * 1.7)); });
      }
      hoverLast = px;
    }
  });
  function release() { if (grab >= 0) { var t = tags[grab]; if (moved < 6) { t.yawT += Math.PI; t.om += 1.4; } else t.om = Math.max(-6, Math.min(6, dragVel)); } grab = -1; }
  cv.addEventListener('pointerup', release); cv.addEventListener('pointercancel', function () { grab = -1; });
  cv.addEventListener('pointerleave', function () { hoverLast = null; });

  var clock = new T.Clock(), t = 0, visible = true;
  if (window.IntersectionObserver) new IntersectionObserver(function (en) { visible = en[0].isIntersecting; }).observe(wrap);
  function frame() {
    requestAnimationFrame(frame);
    if (!visible || document.hidden) return;
    var dt = Math.min(clock.getDelta(), 0.04); if (!reduce) t += dt;
    if (!reduce) tags.forEach(function (g, i) {
      if (grab === i) return;
      var left = tags[i - 1] ? tags[i - 1].th : g.th, right = tags[i + 1] ? tags[i + 1].th : g.th;
      var acc = -(9 / g.L) * Math.sin(g.th) - 0.55 * g.om + 1.1 * (left + right - 2 * g.th) + 0.45 * Math.sin(t * 0.9 + i * 0.8);
      g.om += acc * dt; g.th += g.om * dt;
      g.timer -= dt; if (g.timer <= 0) { g.yawT += Math.PI; g.timer = 7 + Math.random() * 5; }
      g.yaw += (g.yawT - g.yaw) * Math.min(1, dt * 6);
    });
    tags.forEach(function (g) { g.pivot.rotation.z = g.th; g.flip.rotation.y = g.yaw; g.flip.rotation.x = g.om * 0.04; g.flip.rotation.z = -g.th * 0.35; });
    renderer.render(scene, camera);
    cv.dataset.ready = '1';
  }
  frame();
}

var booted = false;
function boot(){ if (booted) return; booted = true; var go = function(){ initTagRail(document.getElementById('tagrail'), document.getElementById('wrap')); }; if (window.THREE) go(); else window.addEventListener('load', go); }
var fonts = document.fonts && document.fonts.load ? Promise.all([document.fonts.load('800 60px Fraunces'), document.fonts.load("600 22px 'DM Mono'"), document.fonts.load('italic 600 40px Fraunces')]).catch(function(){}) : Promise.resolve();
fonts.then(boot); setTimeout(boot, 2500);
})();
</script>
</body>
</html>
